type: agent
name: base_harness
description: Base Harness for a long-context QA agent that reads a hidden document through evidence tools.
max_context_tokens: 131072
system_prompt: ./systemprompt.md
system_prompt_type: jinja
max_iterations: 30

tools:
  - name: scan
    yaml_path: ./tools/scan.tool.yaml
    binding: tool_impl.ops:scan
  - name: grep
    yaml_path: ./tools/grep.tool.yaml
    binding: tool_impl.ops:grep
  - name: read_lines
    yaml_path: ./tools/read_lines.tool.yaml
    binding: tool_impl.ops:read_lines
  - name: bash
    yaml_path: ./tools/bash.tool.yaml
    binding: tool_impl.ops:bash
  - name: notepad
    yaml_path: ./tools/notepad.tool.yaml
    binding: tool_impl.ops:notepad
  - name: complete_task
    yaml_path: ./tools/complete_task.tool.yaml
    binding: evoin.runtime.builtin:complete_task

stop_tools: [complete_task]
middlewares:
  - import: middleware.long_tool_output:LongToolOutputMiddleware
    params:
      max_output_chars: 12000
      head_lines: 80
      tail_lines: 40
      head_chars: 6000
      tail_chars: 6000
