[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "evoin"
version = "0.1.0"
description = "Harness evolution and trajectory rewriting for agent fine-tuning"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "jinja2>=3.0",
]

[tool.setuptools.packages.find]
include = ["evoin*"]

[tool.setuptools.package-data]
"evoin.evolve" = ["prompts/*.md"]
"evoin.runtime" = ["*.md"]
"evoin.tailor" = ["prompts/*.md"]

[tool.ruff]
line-length = 110
